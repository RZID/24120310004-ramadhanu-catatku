; PHP-FPM pool for the production image. The master already runs as www-data, so
; user and group are absent on purpose. clear_env = no is required: without it
; php-fpm wipes the environment and Laravel never sees the injected DB_PASSWORD,
; APP_KEY and the rest.
[www]
listen = 127.0.0.1:9000
clear_env = no
pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
catch_workers_output = yes
