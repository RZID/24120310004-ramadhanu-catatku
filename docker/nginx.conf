# Production web server. The entrypoint replaces __PORT__ before nginx starts,
# because nginx cannot read environment variables by itself.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;

    # The container runs as www-data, so every writable path lives under /tmp.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 8m;

    server {
        listen __PORT__;
        server_name _;

        root /var/www/html/public;
        index index.php;

        charset utf-8;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            include /etc/nginx/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            fastcgi_param DOCUMENT_ROOT $realpath_root;
            fastcgi_param HTTPS $https if_not_empty;
            fastcgi_pass 127.0.0.1:9000;
        }

        # Dotfiles stay hidden, except the ACME challenge path.
        location ~ /\.(?!well-known) {
            deny all;
        }
    }
}
