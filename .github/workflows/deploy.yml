name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    # Job level so a step can test them in `if:`; secrets are not available there.
    env:
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}

    steps:
      - name: Check required secrets
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          APP_PATH: ${{ secrets.APP_PATH }}
        run: |
          missing=0

          for name in SSH_HOST SSH_USER SSH_PRIVATE_KEY APP_PATH; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name is empty or missing (Settings > Secrets and variables > Actions)."
              missing=1
            fi
          done

          case "$SSH_PRIVATE_KEY" in
            -----BEGIN*) ;;
            '') ;;
            *)
              echo "::error::SSH_PRIVATE_KEY must be the whole private key, starting with -----BEGIN ... KEY-----."
              missing=1
              ;;
          esac

          # The tunnel pair is optional: set both to reach the server through
          # Cloudflare Tunnel, leave both empty for a directly reachable host.
          if [ -n "$CF_ACCESS_CLIENT_ID" ] && [ -z "$CF_ACCESS_CLIENT_SECRET" ]; then
            echo "::error::CF_ACCESS_CLIENT_ID is set but CF_ACCESS_CLIENT_SECRET is empty."
            missing=1
          fi

          if [ -z "$CF_ACCESS_CLIENT_ID" ] && [ -n "$CF_ACCESS_CLIENT_SECRET" ]; then
            echo "::error::CF_ACCESS_CLIENT_SECRET is set but CF_ACCESS_CLIENT_ID is empty."
            missing=1
          fi

          exit "$missing"

      - name: Check Cloudflare Access
        if: env.CF_ACCESS_CLIENT_ID != ''
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 \
            -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
            -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
            "https://$SSH_HOST/") || code=000

          case "$code" in
            302)
              echo "::error::Access redirected to a login page, so the policy on $SSH_HOST is not Service Auth. Edit the Access application and set the policy action to Service Auth, then include the service token in it."
              exit 1
              ;;
            401 | 403)
              echo "::error::Access rejected the service token for $SSH_HOST (HTTP $code): the token is wrong, expired, revoked, or no policy grants it access."
              exit 1
              ;;
            000)
              echo "::error::https://$SSH_HOST cannot be reached at all: check that the published route exists and that cloudflared is running on the server."
              exit 1
              ;;
            *)
              echo "Access accepted the service token (HTTP $code)"
              ;;
          esac

      - name: Validate the deploy key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # Parse the key here, so a mangled or passphrase protected secret is
          # reported as such instead of surfacing later as "Permission denied".
          if ! ssh-keygen -y -f ~/.ssh/deploy_key < /dev/null > ~/.ssh/deploy_key.pub 2> /tmp/keyerr; then
            echo "::error::SSH_PRIVATE_KEY cannot be read as a private key ($(tr -d '\n' < /tmp/keyerr)). Paste the file exactly as ssh-keygen wrote it, with real newlines, no passphrase, from BEGIN to END."
            exit 1
          fi
          chmod 644 ~/.ssh/deploy_key.pub

          # The public half is not a secret and identifies the key unambiguously.
          echo "Deploy key: $(ssh-keygen -lf ~/.ssh/deploy_key.pub | awk '{print $2}')"
          echo "Public half, which must appear in the server's authorized_keys:"
          cat ~/.ssh/deploy_key.pub

      - name: Set up SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          if [ -n "$CF_ACCESS_CLIENT_ID" ]; then
            mkdir -p ~/.local/bin
            curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
              -o ~/.local/bin/cloudflared
            chmod +x ~/.local/bin/cloudflared
            ~/.local/bin/cloudflared --version

            # SSH is not exposed on a public port: cloudflared opens the
            # connection through the tunnel and authenticates with the Access
            # service token. Flags are passed explicitly because the client
            # ignores the TUNNEL_SERVICE_TOKEN_* environment variables.
            {
              echo "Host $SSH_HOST"
              echo "  User $SSH_USER"
              echo "  IdentityFile ~/.ssh/deploy_key"
              echo "  IdentitiesOnly yes"
              echo "  StrictHostKeyChecking accept-new"
              echo "  ProxyCommand $HOME/.local/bin/cloudflared access ssh --hostname %h --service-token-id $CF_ACCESS_CLIENT_ID --service-token-secret $CF_ACCESS_CLIENT_SECRET"
            } > ~/.ssh/config
            chmod 600 ~/.ssh/config
            echo "Using Cloudflare Tunnel for $SSH_HOST"
          else
            {
              echo "Host $SSH_HOST"
              echo "  User $SSH_USER"
              echo "  IdentityFile ~/.ssh/deploy_key"
              echo "  IdentitiesOnly yes"
            } > ~/.ssh/config
            chmod 600 ~/.ssh/config

            if ! ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null; then
              echo "::error::Cannot reach $SSH_HOST on port 22 from the runner. Set CF_ACCESS_CLIENT_ID and CF_ACCESS_CLIENT_SECRET to go through Cloudflare Tunnel instead (docs/deployment.md section 4b)."
              exit 1
            fi
            echo "Using a direct SSH connection to $SSH_HOST"
          fi

      - name: Verify the SSH connection
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          APP_PATH: ${{ secrets.APP_PATH }}
        run: |
          # The runner log needs authentication to read, but the annotation is public, so
          # every failure message carries the exit status and the tail of the output.
          fail() {
            local status="$1" output="$2" reason

            case "$output" in
              *"Permission denied"*)
                reason="The server refused the deploy key. Compare the fingerprint printed by the previous step with 'ssh-keygen -lf ~/.ssh/authorized_keys' on the server: the public half of SSH_PRIVATE_KEY must be in that file for SSH_USER, with mode 600 on the file and 700 on ~/.ssh."
                ;;
              *"Host key verification failed"*)
                reason="The server presented a different host key than on a previous run. Confirm the key really changed before deleting it from known_hosts."
                ;;
              *"docker: not found"* | *"command not found"* | *"not a docker command"*)
                reason="Logged in, but docker or docker compose is not available to SSH_USER. Add the user to the docker group and open a new session."
                ;;
              *"not a git repository"*)
                reason="APP_PATH exists but is not a clone of the repository. Clone it there (docs/deployment.md section 3)."
                ;;
              *"No such file or directory"*)
                reason="APP_PATH does not exist on the server. Clone the repository there first (docs/deployment.md section 3)."
                ;;
              *"handshake"* | *"connection refused"* | *"Connection refused"* | *"connection reset"* | *"timed out"* | *"Connection closed"* | *"kex_exchange_identification"*)
                reason="The tunnel accepted the token but SSH did not answer. Check that the published route points at the right host and port (localhost:22) and that sshd is running."
                ;;
              *"Could not resolve hostname"* | *"Name or service not known"*)
                reason="SSH_HOST cannot be resolved. Check the tunnel hostname in the secret."
                ;;
              *)
                reason="SSH login or the remote checks failed. See docs/deployment.md section 4c for the usual causes."
                ;;
            esac

            printf '%s\n' "$output"
            echo "::error::$reason (exit $status) Output: $(printf '%s' "$output" | tr '\n' ' ' | tr -s ' ' | tail -c 400)"
            exit 1
          }

          # A one-shot command first: it proves the tunnel, the key and the login without
          # involving stdin. The longer script below cannot be debugged if this fails.
          set +e
          probe=$(ssh -o BatchMode=yes -o ConnectTimeout=30 -o LogLevel=VERBOSE "$SSH_HOST" 'echo connected' 2>&1)
          status=$?
          set -e
          [ "$status" -eq 0 ] || fail "$status" "$probe"

          set +e
          output=$(ssh -o BatchMode=yes -o ConnectTimeout=30 "$SSH_HOST" "APP_PATH='$APP_PATH' sh -s" <<'CHECK' 2>&1
          set -eu

          # A leading ~ stays literal inside a quoted variable, and the secret is easy
          # to write as ~/catatku, so expand it against the login user's home here.
          case "$APP_PATH" in
            "~") APP_PATH="$HOME" ;;
            "~/"*) APP_PATH="$HOME/${APP_PATH#\~/}" ;;
          esac

          echo "logged in as $(id -un) on $(hostname), APP_PATH is $APP_PATH"
          cd "$APP_PATH"
          echo "clone at $(pwd) on branch $(git rev-parse --abbrev-ref HEAD)"
          docker compose version
          CHECK
          )
          status=$?
          set -e
          [ "$status" -eq 0 ] || fail "$status" "$output"

      - name: Pull, rebuild and migrate
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          APP_PATH: ${{ secrets.APP_PATH }}
        run: |
          ssh -o BatchMode=yes "$SSH_HOST" "APP_PATH='$APP_PATH' sh -s" <<'REMOTE'
          set -eu

          # A leading ~ stays literal inside a quoted variable, and the secret is easy
          # to write as ~/catatku, so expand it against the login user's home here.
          case "$APP_PATH" in
            "~") APP_PATH="$HOME" ;;
            "~/"*) APP_PATH="$HOME/${APP_PATH#\~/}" ;;
          esac

          echo "Deploying into $APP_PATH"
          cd "$APP_PATH"
          git fetch --prune origin main
          git reset --hard origin/main

          compose="docker compose -f docker-compose.production.yml"

          # Build first, then bring the database up and wait for it explicitly:
          # `compose run` does not honour the healthcheck condition on every
          # Compose implementation, and migrate would fail on a cold database.
          $compose build
          $compose up -d db

          # Counted loop instead of `seq`: busybox and some minimal images do not
          # ship it, and the whole script has to stay POSIX sh.
          attempt=0
          ready=0
          while [ "$attempt" -lt 60 ]; do
            if $compose exec -T db sh -c \
              'mysqladmin ping --host=127.0.0.1 --user=root --password="$MYSQL_ROOT_PASSWORD"' >/dev/null 2>&1; then
              ready=1
              break
            fi
            attempt=$((attempt + 1))
            sleep 2
          done

          if [ "$ready" != "1" ]; then
            echo "The database did not accept connections within 120 seconds." >&2
            $compose logs --tail 30 db
            exit 1
          fi

          # Migrate with the new image while the previous container still serves
          # traffic, so a failed migration leaves the running app untouched.
          $compose run --rm app php artisan migrate --force
          $compose up -d --remove-orphans

          $compose ps
          REMOTE
